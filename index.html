const { useState, useEffect, useRef, useCallback } = React;

const PARTY_DATE = new Date("2026-04-28T17:00:00+06:00");

function useCountdown(target) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);
  const diff = Math.max(0, target - now);
  return {
    days: Math.floor(diff / 86400000),
    hours: Math.floor((diff % 86400000) / 3600000),
    minutes: Math.floor((diff % 3600000) / 60000),
    seconds: Math.floor((diff % 60000) / 1000),
  };
}

/* ── Starfield canvas ── */
function Starfield() {
  const ref = useRef(null);
  const starsRef = useRef([]);
  const shootingRef = useRef([]);
  const frameRef = useRef(0);

  useEffect(() => {
    const c = ref.current;
    if (!c) return;
    const ctx = c.getContext("2d");
    let w = (c.width = c.offsetWidth * 2);
    let h = (c.height = c.offsetHeight * 2);

    starsRef.current = Array.from({ length: 220 }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: 0.3 + Math.random() * 1.8,
      speed: 0.02 + Math.random() * 0.08,
      phase: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.7 ? 180 + Math.random() * 40 : 220 + Math.random() * 30,
    }));

    const addShooting = () => {
      if (shootingRef.current.length < 2 && Math.random() < 0.008) {
        shootingRef.current.push({
          x: Math.random() * w * 0.8,
          y: Math.random() * h * 0.3,
          len: 60 + Math.random() * 100,
          speed: 6 + Math.random() * 6,
          angle: (Math.PI / 6) + Math.random() * (Math.PI / 8),
          life: 1,
        });
      }
    };

    let raf;
    const draw = () => {
      frameRef.current++;
      ctx.clearRect(0, 0, w, h);

      starsRef.current.forEach((s) => {
        const flicker = 0.4 + 0.6 * Math.sin(frameRef.current * s.speed + s.phase);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${s.hue}, 80%, 82%, ${flicker * 0.9})`;
        ctx.fill();
        if (s.r > 1.2) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r * 3, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${s.hue}, 90%, 70%, ${flicker * 0.08})`;
          ctx.fill();
        }
      });

      addShooting();
      shootingRef.current = shootingRef.current.filter((sh) => {
        sh.x += Math.cos(sh.angle) * sh.speed;
        sh.y += Math.sin(sh.angle) * sh.speed;
        sh.life -= 0.015;
        if (sh.life <= 0) return false;
        const grad = ctx.createLinearGradient(
          sh.x, sh.y,
          sh.x - Math.cos(sh.angle) * sh.len,
          sh.y - Math.sin(sh.angle) * sh.len
        );
        grad.addColorStop(0, `rgba(0,245,255,${sh.life})`);
        grad.addColorStop(1, `rgba(0,245,255,0)`);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(sh.x, sh.y);
        ctx.lineTo(
          sh.x - Math.cos(sh.angle) * sh.len,
          sh.y - Math.sin(sh.angle) * sh.len
        );
        ctx.stroke();
        return true;
      });

      raf = requestAnimationFrame(draw);
    };
    draw();

    const onResize = () => {
      w = c.width = c.offsetWidth * 2;
      h = c.height = c.offsetHeight * 2;
    };
    window.addEventListener("resize", onResize);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener("resize", onResize);
    };
  }, []);

  return (
    <canvas
      ref={ref}
      style={{
        position: "fixed",
        inset: 0,
        width: "100%",
        height: "100%",
        pointerEvents: "none",
        zIndex: 0,
      }}
    />
  );
}

/* ── Orbital ring ── */
function OrbitalRing({ size, dur, tilt, opacity, color }) {
  return (
    <div
      style={{
        position: "absolute",
        width: size,
        height: size,
        border: `1px solid ${color || "rgba(0,245,255,0.12)"}`,
        borderRadius: "50%",
        top: "50%",
        left: "50%",
        transform: `translate(-50%, -50%) rotateX(${tilt}deg)`,
        animation: `orbitSpin ${dur}s linear infinite`,
        opacity: opacity || 0.3,
        pointerEvents: "none",
      }}
    />
  );
}

/* ── Hex grid pattern ── */
function HexGrid() {
  return (
    <svg
      style={{
        position: "fixed",
        inset: 0,
        width: "100%",
        height: "100%",
        opacity: 0.025,
        pointerEvents: "none",
        zIndex: 0,
      }}
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <pattern id="hex" width="56" height="100" patternUnits="userSpaceOnUse" patternTransform="scale(1.5)">
          <path
            d="M28 2L54 18V50L28 66L2 50V18Z"
            fill="none"
            stroke="cyan"
            strokeWidth="0.4"
          />
          <path
            d="M28 34L54 50V82L28 98L2 82V50Z"
            fill="none"
            stroke="cyan"
            strokeWidth="0.4"
          />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#hex)" />
    </svg>
  );
}

/* ── Scan line ── */
function ScanLine() {
  return (
    <div
      style={{
        position: "fixed",
        left: 0,
        width: "100%",
        height: 2,
        background: "linear-gradient(90deg, transparent, rgba(0,245,255,0.15), transparent)",
        animation: "scanMove 6s linear infinite",
        pointerEvents: "none",
        zIndex: 1,
      }}
    />
  );
}

function CosmicInvitation() {

  const [phase, setPhase] = useState("gate");

  const [glitchText, setGlitchText] = useState(false);

  const [rsvpGuests, setRsvpGuests] = useState("1");
  const [rsvpAttending, setRsvpAttending] = useState(true);

  const [wishes, setWishes] = useState([]);

  const [reserveItem, setReserveItem] = useState(null);
  const [reserverName, setReserverName] = useState("");

  const [loading, setLoading] = useState(false);

  /* Admin */
  const [showPassInput, setShowPassInput] = useState(false);
  const [passValue, setPassValue] = useState("");
  const [passError, setPassError] = useState(false);
  const [isAdmin, setIsAdmin] = useState(false);
  const [editItem, setEditItem] = useState(null);
  const [addForm, setAddForm] = useState(false);
  const [newItem, setNewItem] = useState({ name: "", cat: "other", prio: 2, price: "", link: "", note: "" });

  /* Normalize object keys — trim spaces from Google Sheets headers */
  const trimKeys = (obj) => {
    const cleaned = {};
    Object.keys(obj).forEach((k) => {
      cleaned[k.trim()] = obj[k];
    });
    // Ensure correct types
    cleaned.prio = Number(cleaned.prio) || 2;
    cleaned.price = Number(cleaned.price) || 0;
    cleaned.reserved = cleaned.reserved === true || cleaned.reserved === "TRUE" || cleaned.reserved === "true";
    cleaned.reservedBy = cleaned.reservedBy || "";
    cleaned.cat = cleaned.cat || "other";
    cleaned.link = typeof cleaned.link === "string" ? cleaned.link : "";
    cleaned.note = cleaned.note || "";
    cleaned.name = cleaned.name || "";
    cleaned.multi = cleaned.multi === true || cleaned.multi === "TRUE" || cleaned.multi === "true";
    return cleaned;
  };

  /* Load wishes from Google Sheets */
  const loadWishes = async () => {
    try {
      setLoading(true);
      const res = await fetch(API_URL + "?action=getWishes");
      const data = await res.json();
      if (Array.isArray(data)) {
        setWishes(data.map(trimKeys));
      }
    } catch (e) { console.log("Load error", e); }
    setLoading(false);
  };

  useEffect(() => { loadWishes(); }, []);

  /* API helper — all via GET to avoid CORS issues */
  const apiCall = async (action, data) => {
    try {
      const url = API_URL + "?action=" + action + "&data=" + encodeURIComponent(JSON.stringify(data));
      await fetch(url);
    } catch (e) { console.log("API error", e); }
  };

  const tryLogin = () => {
    if (passValue === ADMIN_PASS) {
      setIsAdmin(true);
      setShowPassInput(false);
      setPassValue("");
      setPassError(false);
      setPhase("admin");
      loadWishes();
    } else {
      setPassError(true);
    }
  };

  const genId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  const addWish = async () => {
    if (!newItem.name.trim()) return;
    const id = genId();
    const item = { ...newItem, id, price: newItem.price ? Number(newItem.price) : 0, reserved: false };
    setWishes((prev) => [...prev, item]);
    setNewItem({ name: "", cat: "other", prio: 2, price: "", link: "", note: "" });
    setAddForm(false);
    await apiCall("addWish", item);
  };

  const saveEdit = async () => {
    if (!editItem) return;
    const updated = { ...editItem, price: Number(editItem.price) || 0 };
    setWishes((prev) => prev.map((w) => w.id === editItem.id ? updated : w));
    setEditItem(null);
    await apiCall("updateWish", updated);
  };

  const deleteWish = async (id) => {
    setWishes((prev) => prev.filter((w) => w.id !== id));
    await apiCall("deleteWish", { id });
  };

  const handleRsvp = async () => {
    if (!rsvpName.trim()) return;
    setRsvpSent(true);
    await apiCall("rsvp", {
      name: rsvpName,
      company: rsvpCompany,
      attending: rsvpAttending,
      guests: rsvpGuests,
    });
    setTimeout(() => {
      setShowRsvp(false);
      setTimeout(() => setRsvpSent(false), 300);
    }, 2500);
  };

  const handleReserve = async () => {
    if (!reserverName.trim() || !reserveItem) return;
    if (reserveItem.multi) {
      // Multi-reserve: append name, keep card active
      setWishes((prev) => prev.map((w) => {
        if (w.id !== reserveItem.id) return w;
        const existing = w.reservedBy ? w.reservedBy.split(", ").filter(Boolean) : [];
        existing.push(reserverName);
        return { ...w, reservedBy: existing.join(", "), contributors: existing.length };
      }));
    } else {
      // Single reserve: mark as reserved
      setWishes((prev) => prev.map((w) => w.id === reserveItem.id ? { ...w, reserved: true, reservedBy: reserverName } : w));
    }
    setReserveOk(true);
    await apiCall("reserveWish", { id: reserveItem.id, reservedBy: reserverName, multi: reserveItem.multi });
    setTimeout(() => { setReserveItem(null); setReserverName(""); setReserveOk(false); }, 2200);
  };

  const filteredWishes = wishes.filter((w) => wCat === "all" || w.cat === wCat).sort((a, b) => b.prio - a.prio);

  useEffect(() => {
    if (phase === "main") {
      setTimeout(() => setReveal(true), 300);
    }
  }, [phase]);

  useEffect(() => {
    const id = setInterval(() => {
      setGlitchText(true);
      setTimeout(() => setGlitchText(false), 150);
    }, 5000);
    return () => clearInterval(id);
  }, []);

  /* ── Gate ── */
  if (phase === "gate") {
    return (
      <div style={S.gateWrap}>
        <style>{CSS}</style>
        <Starfield />
        <HexGrid />
        <ScanLine />

        <div style={S.gateContent}>
          {/* Orbital rings */}
          <div style={S.orbitalWrap}>

            <OrbitalRing size={220} dur={15} tilt={65} opacity={0.1} color="rgba(138,92,246,0.15)" />
            <OrbitalRing size={340} dur={30} tilt={78} opacity={0.08} />
            <div style={S.gateCoreGlow} />
            <div style={S.gateCoreInner}>
              <span style={S.gateCoreIcon}>⬡</span>
            </div>
          </div>

          <div style={S.gateTag}>[ ВХОДЯЩИЙ СИГНАЛ · КАНАЛ ЗАЩИЩЁН ]</div>
          <h1 style={S.gateTitle}>
            <span style={S.gateTitleAccent}>ПРИГЛАШЕНИЕ</span>
          </h1>
          <p style={S.gateSub}>Частота доступна · Соединение установлено</p>

          <button style={S.gateBtn} onClick={() => setPhase("main")}>
            <span style={S.gateBtnDot} />
            ПОДКЛЮЧИТЬСЯ
            <span style={S.gateBtnDot} />
          </button>

          <div style={S.gateCoords}>
            <span>43.2389°N</span>
            <span style={S.gateCoordSep}>|</span>
            <span>76.9453°E</span>
            <span style={S.gateCoordSep}>|</span>
            <span>ALMATY</span>
          </div>

          {/* Secret admin entry */}
          {!showPassInput ? (
            <div
              style={S.adminTrigger}
              onClick={() => setShowPassInput(true)}
            >
              ⬡ ВХОД ДЛЯ ИМЕНИННИЦЫ
            </div>
          ) : (
            <div style={S.passBox}>
              <input
                style={{
                  ...S.fieldInput,
                  textAlign: "center",
                  fontSize: "0.8rem",
                  borderColor: passError ? "#ff6b6b" : "rgba(0,245,255,0.15)",
                }}
                type="password"
                placeholder="Введите код доступа..."
                value={passValue}
                onChange={(e) => { setPassValue(e.target.value); setPassError(false); }}
                onKeyDown={(e) => e.key === "Enter" && tryLogin()}
                autoFocus
              />
              {passError && <p style={S.passError}>✕ НЕВЕРНЫЙ КОД</p>}
              <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
                <button style={S.modalCancel} onClick={() => { setShowPassInput(false); setPassValue(""); setPassError(false); }}>ОТМЕНА</button>
                <button style={{ ...S.modalSubmit, flex: 1 }} onClick={tryLogin}>ВОЙТИ</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ── Admin Panel ── */
  if (phase === "admin") {
    return (
      <div style={S.root}>
        <style>{CSS}</style>
        <Starfield />
        <HexGrid />

        <div style={{ position: "relative", zIndex: 2, maxWidth: 700, margin: "0 auto", padding: "20px" }}>
          {/* Admin header */}
          <div style={{ textAlign: "center", padding: "40px 0 20px" }}>
            <div style={S.heroTerminal}>ADMIN_PANEL // WISHLIST_MANAGER</div>
            <h1 style={{ ...S.heroName, fontSize: "1.8rem", marginTop: 10 }}>
              УПРАВЛЕНИЕ <span style={S.heroNameSur}>WISHLIST</span>

            <p style={{ ...S.heroSubtext, marginTop: 8 }}>

            </p>
            <div style={{ ...S.heroDivider, margin: "16px 0" }}>

              <span style={S.heroDivIcon}>◈</span>
              <span style={S.heroDivLine} />
            </div>
            <div style={S.wlTerminal}>
              ВСЕГО: {wishes.length} · ЗАБРОНИРОВАНО: {wishes.filter(w => w.reserved).length} · СУММА: {wishes.reduce((s, w) => s + (w.price || 0), 0).toLocaleString()} ₸
            </div>
          </div>

          {/* Add button */}
          <div style={{ textAlign: "center", margin: "20px 0", display: "flex", justifyContent: "center", gap: 12 }}>

              const cat = W_CATS.find(c => c.id === item.cat);
              return (

                      style={{ ...S.wlReserveBtn, flex: 1, color: cyan }}

                    <button

          {wishes.length === 0 && (

                  <div style={S.fieldGroup}>
                    <label style={S.fieldLabel}>КОЛИЧЕСТВО ПОДКЛЮЧЕНИЙ</label>
                    <div style={S.guestRow}>
                      {["1", "2", "3"].map((n) => (
                        <button
                          key={n}
                          style={{
                            ...S.guestBtn,
                            background: rsvpGuests === n ? cyan : "rgba(0,245,255,0.05)",
                            color: rsvpGuests === n ? deep : cyanDim,
                            borderColor: rsvpGuests === n ? cyan : "rgba(0,245,255,0.2)",
                          }}
                          onClick={() => setRsvpGuests(n)}
                        >
                          {n === "1" ? "Я один" : n === "2" ? "Я + 1" : "Я + 2"}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                <div style={S.modalBtns}>
                  <button style={S.modalCancel} onClick={() => setShowRsvp(false)}>
                    ОТМЕНА
                  </button>
                  <button
                    style={{
                      ...S.modalSubmit,
                      background: rsvpAttending
                        ? `linear-gradient(135deg, #00ff88, ${cyan})`
                        : "linear-gradient(135deg, #ff6b6b, #ff8e53)",
                      boxShadow: rsvpAttending
                        ? "0 0 20px rgba(0,255,136,0.15)"
                        : "0 0 20px rgba(255,107,107,0.15)",
                    }}
                    onClick={handleRsvp}
                  >
                    <span style={S.wishBtnGlow} />
                    ОТПРАВИТЬ ✓
                  </button>
                </div>
              </>
            ) : (
              <div style={S.rsvpSuccess}>
                {rsvpAttending ? (
                  <>
                    <div style={S.successIcon}>✓</div>
                    <h3 style={S.successTitle}>СОЕДИНЕНИЕ УСТАНОВЛЕНО!</h3>
                    <p style={S.successText}>
                      {rsvpName}{rsvpCompany ? ` · ${rsvpCompany}` : ""}, ты в списке! Ждём тебя 28 апреля в 17:00
                    </p>
                  </>
                ) : (
                  <>
                    <div style={{ ...S.successIcon, borderColor: "#ff6b6b", color: "#ff6b6b", boxShadow: "0 0 30px rgba(255,107,107,0.2)" }}>✕</div>
                    <h3 style={{ ...S.successTitle, color: "#ff8e53", textShadow: "0 0 20px rgba(255,142,83,0.3)" }}>СИГНАЛ ПРИНЯТ</h3>
                    <p style={S.successText}>
                      {rsvpName}, очень жаль! Будем скучать. Надеемся на связь в следующий раз!
                    </p>
                  </>
                )}
                <div style={S.successBar}>
                  <div style={{
                    ...S.successBarFill,
                    background: rsvpAttending
                      ? `linear-gradient(90deg, #00ff88, ${cyan})`
                      : "linear-gradient(90deg, #ff6b6b, #ff8e53)",
                  }} />
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
